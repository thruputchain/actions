name: 'Cargo Nightly Version'
description: 'Computes a <next-patch>-nightly.<date>.g<sha> prerelease version and rewrites the workspace Cargo.toml in place (uncommitted). Reusable across cargo workspaces.'
author: 'Groundhog Team'

inputs:
  cargo-toml-path:
    description: 'Path to the workspace Cargo.toml'
    required: false
    default: './Cargo.toml'
  commit:
    description: 'If "true", commit the rewrite locally (using a throwaway identity) so cargo package/publish see a clean working tree. The commit is NOT pushed; the caller is responsible for tagging the original pre-bump commit. Only the manifest is staged.'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The computed nightly version (e.g. 0.17.2-nightly.20260622.gabc1234)'
    value: ${{ steps.compute.outputs.version }}
  sha:
    description: 'Short (7) git SHA used in the version'
    value: ${{ steps.compute.outputs.sha }}

runs:
  using: 'composite'
  steps:
    - name: Compute and apply nightly version
      id: compute
      shell: bash
      env:
        CARGO_TOML_PATH: ${{ inputs.cargo-toml-path }}
        ACTION_PATH: ${{ github.action_path }}
        COMMIT: ${{ inputs.commit }}
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"

        OLD=$(cargo metadata --manifest-path "$CARGO_TOML_PATH" --format-version 1 --no-deps \
          | jq -r '.packages[] | select(.manifest_path | endswith("Cargo.toml")) | .version' | head -1)
        if [ -z "$OLD" ] || [ "$OLD" = "null" ]; then
          echo "::error::Could not read workspace version from $CARGO_TOML_PATH"; exit 1
        fi

        DATE=$(date -u +%Y%m%d)
        SHA=$(git rev-parse --short=7 HEAD)
        NEW=$(bash "$ACTION_PATH/version.sh" next-version "$OLD" "$DATE" "$SHA")
        if [ -z "$NEW" ]; then
          echo "::error::version.sh produced an empty version"; exit 1
        fi

        echo "Old version: $OLD"
        echo "New version: $NEW"

        bash "$ACTION_PATH/version.sh" apply "$OLD" "$NEW" "$CARGO_TOML_PATH"

        if [ "$COMMIT" = "true" ]; then
          # Ephemeral local commit so cargo package/publish see a clean tree.
          # NOT pushed; the caller tags the original pre-bump commit. Only the
          # manifest is staged (avoids staging the runtime actions/ or vendor/ dirs).
          git config user.email "nightly-bot@groundhog.local"
          git config user.name "nightly-bot"
          git add -- "$CARGO_TOML_PATH"
          git commit -q -m "ephemeral nightly version $NEW (not pushed)"
        fi

        echo "version=$NEW" >> "$GITHUB_OUTPUT"
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

    - name: Verify rewrite is consistent
      shell: bash
      env:
        CARGO_TOML_PATH: ${{ inputs.cargo-toml-path }}
        EXPECTED: ${{ steps.compute.outputs.version }}
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"
        META=$(cargo metadata --manifest-path "$CARGO_TOML_PATH" --format-version 1 --no-deps)
        BAD=$(echo "$META" | jq -r --arg v "$EXPECTED" '.packages[] | select(.version != $v) | .name')
        if [ -n "$BAD" ]; then
          echo "::error::Workspace members not at $EXPECTED after rewrite:"
          echo "$BAD"
          exit 1
        fi
        echo "OK: all workspace members report $EXPECTED"

branding:
  icon: 'edit-3'
  color: 'purple'
