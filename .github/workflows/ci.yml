name: CI

# This repository's actions and reusable workflows run inside the CI and
# publish workflows of other repos, with registry tokens and SSH deploy keys
# in scope, so it should meet at least the lint bar of its consumers.
# Thus it lints itself with its own reusable workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    # Declared on the caller as well as in the called workflow: this is the
    # ceiling on the token handed down, and zizmor checks the caller.
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yml
    with:
      shellcheck-scripts: true

  dry-run-registry:
    # Branch protection requires a check with this name; keep it when
    # adding steps here.
    name: Dry-run registry selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install test YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/registry-tests-env"
          "$RUNNER_TEMP/registry-tests-env/bin/pip" install PyYAML==6.0.3
      - name: Test default and explicit private registries offline
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          "$RUNNER_TEMP/registry-tests-env/bin/python" cargo-publish-dry-run/test_registry.py
      - name: Test cargo-publish validation steps offline
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          "$RUNNER_TEMP/registry-tests-env/bin/python" cargo-publish/test_action_steps.py
      - name: Test release-tag registry resolution offline
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash cargo-release-tag/test_registry_index.sh
      - name: Test the dependency policy's git token offline
        run: |
          "$RUNNER_TEMP/registry-tests-env/bin/python" .github/workflows/test_rust_dependency_policy.py

  crates-io-publish:
    name: crates-io-publish against a mock crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test check and publish modes offline
        env:
          RUSTUP_TOOLCHAIN: stable
        run: bash crates-io-publish/test_crates_io_publish.sh

  script-tests:
    name: Script unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version and tag grammar
        run: |
          bash cargo-publish/test_validate_tag.sh
          bash cargo-yank/test_validate_version.sh
      - name: Yank failure classification
        run: bash cargo-yank/test_registry_missing.sh
