name: Rust dependency policy

# Reusable: called as
#   jobs:
#     dependency-policy:
#       uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@<ref>
#
# Policy stays in the calling repository's `deny.toml`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label. Any Linux x86-64 runner."
        type: string
        required: false
        default: ubuntu-latest
      checks:
        description: >-
          cargo-deny checks to run. Empty (default) runs all four and reports
          each in one summary line.
        type: string
        required: false
        default: ""
      cargo-deny-version:
        description: "Exact cargo-deny version to install."
        type: string
        required: false
        default: "0.20.2"
      toolchain:
        description: >-
          RUSTUP_TOOLCHAIN for the check. Defaults to the runner's preinstalled
          `stable`: cargo-deny doesn't need to compile anything and honouring a
          repo's rust-toolchain.toml would download a whole toolchain.
        type: string
        required: false
        default: stable
      registry-name:
        description: >-
          Private cargo registry the graph resolves against, as named in
          .cargo/config.toml.
        type: string
        required: false
        default: ""
      git-app-id:
        description: >-
          Optional GitHub App ID for fetching private git dependencies under
          the caller's owner. The App's installation must cover every
          repository in git-repositories.
        type: string
        required: false
        default: ""
      git-repositories:
        description: >-
          Comma-separated names of the repositories, under the caller's
          owner, that the graph has git dependencies on, and those of their
          submodules, which cargo fetches too (e.g.
          "thruput-protocol-rs,thruput-protocol,bristlecone"). Required with
          git-app-id: the token reads only these.
        type: string
        required: false
        default: ""
    secrets:
      registry-token:
        description: "Token for registry-name. Required only if it is set."
        required: false
      git-app-private-key:
        description: "Private key for the App identified by git-app-id."
        required: false

jobs:
  dependency-policy:
    name: Dependency policy
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    steps:
      # The github context inside a reusable workflow refers to the caller,
      # so this checks out the calling repository.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-deny
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@${{ inputs.cargo-deny-version }}

      # Without repositories the token would read every repository the
      # App's installation covers.
      - name: Check git dependency inputs
        if: inputs.git-app-id != '' && inputs.git-repositories == ''
        run: |
          echo "::error::git-app-id is set but git-repositories is empty"
          exit 1

      # cargo-deny resolves the graph with `cargo metadata`, which fetches
      # every git dependency, so a private one needs read access to its
      # repository.
      - name: Generate git dependency token
        if: inputs.git-app-id != ''
        id: git-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ inputs.git-app-id }}
          private-key: ${{ secrets.git-app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.git-repositories }}
          permission-contents: read

      - name: Check dependency policy
        env:
          RUSTUP_TOOLCHAIN: ${{ inputs.toolchain }}
          CHECKS: ${{ inputs.checks }}
          REGISTRY_NAME: ${{ inputs.registry-name }}
          REGISTRY_TOKEN: ${{ secrets.registry-token }}
          GIT_TOKEN: ${{ steps.git-app-token.outputs.token }}
          GIT_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Exported inside this step rather than written to GITHUB_ENV, so
          # the credential does not outlive the command that needs it. cargo
          # reads CARGO_REGISTRIES_<NAME>_TOKEN, upper-cased, hyphens to
          # underscores.
          if [ -n "$REGISTRY_NAME" ]; then
            if [ -z "$REGISTRY_TOKEN" ]; then
              echo "::error::registry-name is set but the registry-token secret is empty"
              exit 1
            fi
            suffix="$(printf '%s' "$REGISTRY_NAME" | tr '[:lower:]-' '[:upper:]_')"
            export "CARGO_REGISTRIES_${suffix}_TOKEN=$REGISTRY_TOKEN"
            export CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS="cargo:token"
          fi

          # Git dependencies and their submodules under the caller's owner
          # are fetched over HTTPS with the App token, whether they are named
          # by ssh://, scp-style (a submodule's git@github.com:) or https://
          # URL; other URLs, such as the advisory database's, are left
          # alone. Like the registry token, the rewrite lives only in this
          # step's environment. The git CLI reads GIT_CONFIG_*; cargo's
          # built-in git transport does not, hence git-fetch-with-cli.
          # Cargo.lock keeps the manifest's URLs, so deny.toml's allow-git
          # still matches them.
          if [ -n "$GIT_TOKEN" ]; then
            export CARGO_NET_GIT_FETCH_WITH_CLI=true
            rewrite="url.https://x-access-token:${GIT_TOKEN}@github.com/${GIT_OWNER}/.insteadOf"
            export GIT_CONFIG_COUNT=3
            export GIT_CONFIG_KEY_0="$rewrite"
            export GIT_CONFIG_VALUE_0="ssh://git@github.com/${GIT_OWNER}/"
            export GIT_CONFIG_KEY_1="$rewrite"
            export GIT_CONFIG_VALUE_1="git@github.com:${GIT_OWNER}/"
            export GIT_CONFIG_KEY_2="$rewrite"
            export GIT_CONFIG_VALUE_2="https://github.com/${GIT_OWNER}/"
          fi

          # Graph flags must precede the subcommand; cargo-deny rejects them
          # after it. CHECKS is unquoted on purpose: empty must expand to no
          # argument at all, which is how cargo-deny runs every check.
          # shellcheck disable=SC2086
          cargo deny --all-features --locked check $CHECKS
