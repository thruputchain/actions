name: File Rust advisory tracking issue

# Reusable: called as a job that depends on the scan and runs only on its
# failure, e.g.
#   jobs:
#     scan:
#       permissions:
#         contents: read
#       uses: thruputchain/actions/.github/workflows/rust-dependency-policy.yml@<ref>
#       with: { checks: advisories }
#     notify:
#       needs: scan
#       if: failure()
#       permissions:
#         contents: read
#         issues: write
#       uses: thruputchain/actions/.github/workflows/rust-advisory-issue.yml@<ref>
#
# Reports dependency-scan failure by filing an issue. Comments on the existing
# open issue rather than opening a fresh one per failing day, so a standing
# advisory produces one issue with a comment trail.
#
# Performs no checkout: it needs only the REST API and the caller's repository
# name from the github context.
#
# The script is inline under `shell: python` so that actionlint's pyflakes
# integration analyses it.

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: false
        default: ubuntu-latest
      issue-title:
        description: >-
          Exact title used to find the existing issue.
        type: string
        required: false
        default: "Dependency advisory scan failing on main"

jobs:
  file-issue:
    name: File tracking issue
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or update the tracking issue
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ inputs.issue-title }}
        run: |
          import json
          import os
          import urllib.request

          PER_PAGE = 100
          PAGE_CAP = 20

          API = os.environ["GITHUB_API_URL"].rstrip("/")
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          TITLE = os.environ["ISSUE_TITLE"]

          def call(path, data=None):
              request = urllib.request.Request(
                  "{}/repos/{}/{}".format(API, REPO, path),
                  data=None if data is None else json.dumps(data).encode(),
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="GET" if data is None else "POST",
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def find_open_issue():
              # This endpoint returns pull requests as well as issues, and
              # the PRs count toward the page size.
              for page in range(1, PAGE_CAP + 1):
                  batch = call(
                      "issues?state=open&per_page={}&page={}".format(PER_PAGE, page)
                  )
                  for issue in batch:
                      if "pull_request" not in issue and issue["title"] == TITLE:
                          return issue["number"]
                  if len(batch) < PER_PAGE:
                      return None
              print("::warning::gave up after {} pages; may open a duplicate".format(PAGE_CAP))
              return None

          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"], REPO, os.environ["GITHUB_RUN_ID"]
          )
          body = (
              "The scheduled `cargo deny check advisories` run failed: " + run_url + "\n\n"
              "A new advisory may have been filed against a dependency already "
              "pinned in `Cargo.lock`. Reproduce locally with:\n\n"
              "    cargo deny --all-features --locked check advisories\n"
          )

          existing = find_open_issue()
          if existing is not None:
              print("Commenting on existing issue #{}".format(existing))
              call("issues/{}/comments".format(existing), {"body": body})
          else:
              print("Opening new issue")
              call("issues", {"title": TITLE, "body": body})
