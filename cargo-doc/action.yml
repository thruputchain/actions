name: 'Cargo Doc Publish'
description: 'Builds rustdoc for each publishable workspace crate (docs.rs-style: --no-deps with a rustdoc cross-crate link map) and uploads it to the versioned static docs site via publish-docs.sh. Intended for a self-hosted runner with the docs site on a shared/NFS filesystem.'
author: 'Thruput Team'

inputs:
  version:
    description: 'Version to publish docs under, e.g. 0.16.2. Must match every published crate''s Cargo.toml version (validated). Typically the cargo-version-tag action''s version output.'
    required: true
  cargo-toml-path:
    description: 'Path to Cargo.toml file'
    required: false
    default: './Cargo.toml'
  packages:
    description: 'Space-separated list of package names to document. If empty, all workspace packages are used (minus publish=false and arch-only).'
    required: false
    default: ''
  arch-only-packages:
    description: 'Space-separated packages that only build for a non-host target (wasm/rv32). Skipped here, exactly like the dry-run host steps.'
    required: false
    default: ''
  toolchain:
    description: 'Rust toolchain for the doc build. Must be a nightly with cargo (rustdoc cross-crate mapping is nightly-only). E.g. nightly or nightly-2026-01-30.'
    required: false
    default: 'nightly'
  registry-name:
    description: 'Private registry name as defined in .cargo/config.toml. Cross-crate links to deps from this registry are mapped to docs-base-url.'
    required: false
    default: 'thruput'
  registry-token:
    description: 'Auth token for the private registry, so the doc build can resolve registry dependencies. Omit if all deps are workspace-local or crates.io.'
    required: false
    default: ''
  docs-base-url:
    description: 'Public base URL of the docs site. Registry dependency links resolve to <docs-base-url>/<crate>/<version>/<crate>/...'
    required: true
  docs-root:
    description: 'Filesystem base directory of the docs site served by Caddy (must be writable by the runner).'
    required: true
  force:
    description: 'Overwrite already-published doc versions (use for idempotent regeneration).'
    required: false
    default: 'false'
  expected-tag:
    description: 'If set (e.g. v0.16.2), assert HEAD is exactly this tag before building/uploading. Use in the idempotent regenerator to guarantee docs match the tagged source.'
    required: false
    default: ''
  shared-static:
    description: "Serve rustdoc's CSS/JS/font bundle from one shared <docs-root>/_static directory instead of a private ~1.9 MB copy per crate. Set false to embed a copy in every version directory."
    required: false
    default: 'true'
  publish-jobs:
    description: 'Concurrent file copies into the docs tree. The upload is latency-bound on a shared filesystem, so overlapping round trips is what makes it fast; lower it to 1 to take pressure off the docs host.'
    required: false
    default: '4'

runs:
  using: 'composite'
  steps:
    - name: Validate tag matches HEAD
      if: inputs.expected-tag != ''
      shell: bash
      env:
        EXPECTED_TAG: ${{ inputs.expected-tag }}
      run: |
        set -euo pipefail
        echo "Validating HEAD is tag $EXPECTED_TAG ..."
        if ! git rev-parse -q --verify "refs/tags/${EXPECTED_TAG}" >/dev/null; then
          echo "::error::Tag $EXPECTED_TAG does not exist in this checkout"; exit 1
        fi
        TAG_COMMIT=$(git rev-parse "refs/tags/${EXPECTED_TAG}^{commit}")
        HEAD_COMMIT=$(git rev-parse "HEAD^{commit}")
        if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
          echo "::error::HEAD ($HEAD_COMMIT) is not tag $EXPECTED_TAG ($TAG_COMMIT)."
          echo "::error::Check out the tag before regenerating docs."
          exit 1
        fi
        echo "OK: HEAD is $EXPECTED_TAG"

    - name: List packages and validate versions
      id: list-packages
      shell: bash
      env:
        CARGO_TOML_PATH: ${{ inputs.cargo-toml-path }}
        PACKAGES_INPUT: ${{ inputs.packages }}
        ARCH_ONLY_PACKAGES: ${{ inputs.arch-only-packages }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"

        METADATA=$(cargo metadata --manifest-path "$CARGO_TOML_PATH" --no-deps --format-version 1)
        WORKSPACE_PACKAGES=$(echo "$METADATA" | jq -r '.packages[] | .name')

        if [ -n "$PACKAGES_INPUT" ]; then
          PACKAGES="$PACKAGES_INPUT"
          for package in $PACKAGES; do
            if ! echo "$WORKSPACE_PACKAGES" | grep -q "^${package}$"; then
              echo "::error::Package '$package' not found in workspace"; exit 1
            fi
          done
        else
          PACKAGES=$(echo "$METADATA" | jq -r '.packages[] | .name' | tr '\n' ' ')
        fi

        # Filter out publish=false and arch-only packages; validate versions match.
        SELECTED=""
        for package in $PACKAGES; do
          if echo " $ARCH_ONLY_PACKAGES " | grep -qF " $package "; then
            echo "SKIP: $package is architecture-only"; continue
          fi
          IS_PUBLISH_DISABLED=$(echo "$METADATA" | jq -r --arg pkg "$package" \
            '.packages[] | select(.name == $pkg) | if .publish == [] then "true" else "false" end')
          if [ "$IS_PUBLISH_DISABLED" = "true" ]; then
            echo "SKIP: $package has publish=false"; continue
          fi
          PKG_VERSION=$(echo "$METADATA" | jq -r --arg pkg "$package" \
            '.packages[] | select(.name == $pkg) | .version')
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Package '$package' is version $PKG_VERSION but docs version is $VERSION"; exit 1
          fi
          SELECTED="$SELECTED $package"
        done

        SELECTED=$(echo "$SELECTED" | xargs)
        if [ -z "$SELECTED" ]; then
          echo "::error::No publishable packages to document"; exit 1
        fi
        echo "Documenting: $SELECTED (version $VERSION)"
        echo "packages=$SELECTED" >> "$GITHUB_OUTPUT"

    - name: Build and publish docs
      shell: bash
      env:
        CARGO_TOML_PATH: ${{ inputs.cargo-toml-path }}
        PACKAGES: ${{ steps.list-packages.outputs.packages }}
        VERSION: ${{ inputs.version }}
        TOOLCHAIN: ${{ inputs.toolchain }}
        REGISTRY_NAME: ${{ inputs.registry-name }}
        REGISTRY_TOKEN: ${{ inputs.registry-token }}
        DOCS_BASE_URL: ${{ inputs.docs-base-url }}
        DOCS_ROOT: ${{ inputs.docs-root }}
        FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
        SHARED_STATIC: ${{ inputs.shared-static == 'false' && '0' || '1' }}
        PUBLISH_JOBS: ${{ inputs.publish-jobs }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        source "$HOME/.cargo/env"

        # Composite actions do not enforce required inputs.
        if [ -z "$DOCS_BASE_URL" ] || [ -z "$DOCS_ROOT" ]; then
          echo "::error::docs-base-url and docs-root are required"
          exit 1
        fi

        # Ensure the nightly toolchain (with cargo) is present; the rustdoc map
        # is a nightly-only cargo feature.
        rustup toolchain install "$TOOLCHAIN" --profile minimal >/dev/null 2>&1 || true

        # Registry auth so the doc build can resolve private-registry deps.
        if [ -n "$REGISTRY_TOKEN" ]; then
          REGISTRY_NAME_UPPER=$(echo "$REGISTRY_NAME" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          export "CARGO_REGISTRIES_${REGISTRY_NAME_UPPER}_TOKEN=$REGISTRY_TOKEN"
          export "CARGO_REGISTRY_GLOBAL_CREDENTIAL_PROVIDERS=cargo:token"
          echo "::add-mask::$REGISTRY_TOKEN"
        fi

        METADATA=$(cargo metadata --manifest-path "$CARGO_TOML_PATH" --no-deps --format-version 1)
        DOC_DIR="$(echo "$METADATA" | jq -r '.target_directory')/doc"

        # Resolve the rustdoc output subdir (lib/proc-macro target name, honoring
        # an explicit [lib] name=...). Falls back to crate with - -> _.
        lib_name_of() {
          local n
          n=$(echo "$METADATA" | jq -r --arg pkg "$1" '
            [ .packages[] | select(.name==$pkg) | .targets[]
              | select((.kind|index("lib")) or (.kind|index("rlib")) or (.kind|index("proc-macro")))
              | .name ] | .[0] // empty')
          [ -n "$n" ] && echo "$n" || echo "${1//-/_}"
        }

        # Map every published workspace crate to its hosted docs page. The rustdoc
        # registry map only covers deps pulled from a registry; same-workspace
        # crates are PATH deps, so without this their links render as plain,
        # unlinked text. -Z unstable-options enables --extern-html-root-url.
        # Unused entries are ignored by rustdoc. All workspace crates share
        # $VERSION (validated above).
        RUSTDOCFLAGS="-Z unstable-options"
        for sib in $PACKAGES; do
          RUSTDOCFLAGS="$RUSTDOCFLAGS --extern-html-root-url $(lib_name_of "$sib")=${DOCS_BASE_URL}/${sib}/${VERSION}"
        done
        export RUSTDOCFLAGS

        for package in $PACKAGES; do
          echo "=== Documenting $package $VERSION ==="
          lib_name="$(lib_name_of "$package")"

          # Isolate each crate's docs: clear the shared doc dir so the uploaded
          # tree contains only this crate (+ shared assets). --no-deps keeps it
          # small. Cross-crate links resolve via the registry map (registry /
          # crates.io deps) and the --extern-html-root-url entries in
          # RUSTDOCFLAGS (same-workspace path deps).
          rm -rf "$DOC_DIR"
          cargo "+$TOOLCHAIN" doc \
            --manifest-path "$CARGO_TOML_PATH" \
            --package "$package" \
            --no-deps --all-features \
            -Z rustdoc-map \
            --config "doc.extern-map.registries.${REGISTRY_NAME} = \"${DOCS_BASE_URL}\""

          "$ACTION_PATH/../publish-docs/publish-docs.sh" \
            "$package" "$VERSION" "$DOC_DIR" "$lib_name"
        done

        echo "OK: documentation published for: $PACKAGES"

branding:
  icon: 'book-open'
  color: 'blue'
