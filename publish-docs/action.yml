name: 'Publish Rust Docs'
description: 'Installs a built target/doc tree into the versioned static docs site served by Caddy (per-version directories + a latest symlink). Intended to run on a self-hosted runner with the docs site on a shared/NFS filesystem.'
author: 'Thruput Team'

inputs:
  crate:
    description: 'Crate name, e.g. thruput-gateway'
    required: true
  version:
    description: 'Version string, e.g. 0.16.2 (pre-releases contain a "-", e.g. 0.1.1-nightly.x). Typically the version output of the cargo-version-tag action.'
    required: true
  doc-dir:
    description: 'Path to the freshly-built target/doc tree to publish'
    required: false
    default: './target/doc'
  lib-name:
    description: 'rustdoc entry subdir (the crate lib name). Defaults to <crate> with "-" replaced by "_".'
    required: false
    default: ''
  docs-root:
    description: 'Base directory of the static docs site served by Caddy'
    required: true
  force:
    description: 'Overwrite an already-published version instead of failing'
    required: false
    default: 'false'
  shared-static:
    description: "Serve rustdoc's CSS/JS/font bundle from one shared <docs-root>/_static directory instead of a private ~1.9 MB copy per crate. Set false to embed a copy in every version directory."
    required: false
    default: 'true'
  publish-jobs:
    description: 'Concurrent file copies into the docs tree. The upload is latency-bound on a shared filesystem, so overlapping round trips is what makes it fast; lower it to 1 to take pressure off the docs host.'
    required: false
    default: '4'

runs:
  using: 'composite'
  steps:
    - name: Publish docs to the static site
      shell: bash
      env:
        DOCS_ROOT: ${{ inputs.docs-root }}
        FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
        SHARED_STATIC: ${{ inputs.shared-static == 'false' && '0' || '1' }}
        PUBLISH_JOBS: ${{ inputs.publish-jobs }}
        ACTION_PATH: ${{ github.action_path }}
        CRATE: ${{ inputs.crate }}
        VERSION: ${{ inputs.version }}
        DOC_DIR: ${{ inputs.doc-dir }}
        LIB_NAME: ${{ inputs.lib-name }}
      run: |
        "$ACTION_PATH/publish-docs.sh" \
          "$CRATE" \
          "$VERSION" \
          "$DOC_DIR" \
          "$LIB_NAME"

branding:
  icon: 'book'
  color: 'blue'
